server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: puduvandi

  # Spring's own defaults here are 1MB/10MB — well under a real phone camera
  # photo (commonly 2-8MB), which silently failed uploads (bike photos, KYC/
  # licence documents) from real devices instead of the localhost/desktop
  # testing that used small placeholder files.
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/puduvandi}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      # 0, not a fixed count: Neon's free-tier autosuspend only fires when the
      # pool holds zero physical connections. A nonzero minimum-idle keeps that
      # many connections permanently open, which pins the Neon compute "active"
      # 24/7 and burns the monthly compute-hour quota even with no real traffic.
      minimum-idle: 0
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      # Applied to every physical connection Hikari opens. Without these, Postgres
      # will wait FOREVER for a row lock held by another session (a stuck/paused
      # transaction — debugger breakpoint, a bug, a hung downstream call — anything)
      # and will let a transaction sit "idle in transaction" indefinitely, wedging
      # that row for every other request until someone notices and manually kills
      # the backend PID. These bound both: lock_timeout fails a blocked request fast
      # (clear error to the caller) instead of hanging its HTTP thread forever;
      # idle_in_transaction_session_timeout self-heals a stalled transaction by
      # killing it outright, releasing whatever it was holding.
      connection-init-sql: "SET lock_timeout = '10s'; SET idle_in_transaction_session_timeout = '30s'; SET statement_timeout = '30s';"

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway manages schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 3        # DB already has V1-V3 tables (created before Flyway was enabled)
    locations: classpath:db/migration

# ===== JWT Config =====
puduvandi:
  jwt:
    secret: ${JWT_SECRET:Y2hhbmdlLXRoaXMtc2VjcmV0LWluLXByb2R1Y3Rpb24tZW52aXJvbm1lbnQ=}
    access-token-expiry-ms: 900000        # 15 minutes
    refresh-token-expiry-ms: 604800000    # 7 days

  otp:
    expiry-minutes: 5
    length: 6
    mock-enabled: ${OTP_MOCK_ENABLED:true}   # true = always use mock-otp (dev mode only — set explicitly)
    mock-otp: ${OTP_MOCK_VALUE:123456}

  commission:
    default-percentage: 20.0

  deposit:
    # Hours after a booking completes before its unclaimed security deposit auto-refunds.
    auto-release-hours: ${DEPOSIT_AUTO_RELEASE_HOURS:0}

  storage:
    upload-dir: ./uploads   # local disk path; swap for S3 bucket in production

  security:
    # Comma-separated IPs/CIDRs of reverse proxies/load balancers actually in front of this
    # app (e.g. Render's edge). X-Forwarded-For is only trusted for rate-limiting when the
    # DIRECT connection (request.getRemoteAddr()) comes from one of these — otherwise it's
    # attacker-controlled and trusting it lets anyone spoof a fresh IP per request to bypass
    # the per-IP rate-limit cap. Empty (default) = never trust X-Forwarded-For.
    trusted-proxies: ${TRUSTED_PROXIES:}

  encryption:
    # Base64-encoded 32-byte AES-256 key for EncryptedStringConverter (currently only
    # Bike.insuranceDocumentPassword). No committed real default — same rule as
    # razorpay.key-secret/vapid-private-key. Generate with:
    #   openssl rand -base64 32
    key: ${ENCRYPTION_KEY:}

  support-phone: "+91-8946095151"

  razorpay:
    # Key ID is safe to expose (it's public); Key Secret must never have a real default here —
    # both belong only in your local .env (gitignored) or the deployment environment's secrets.
    key-id: ${RAZORPAY_KEY_ID:rzp_test_TEWOpmoWh3IbSE}
    key-secret: ${RAZORPAY_KEY_SECRET:k177pNbdsPzoQCHu4MXfM2ho}
    # true = booking creation auto-confirms instantly, no real gateway call (local/dev default).
    # false = booking sits PAYMENT_PENDING until a real Razorpay payment is verified.
    mock-enabled: ${PAYMENT_MOCK_ENABLED:true}
    # Unpaid PAYMENT_PENDING bookings past this age are auto-cancelled and the bike released.
    payment-expiry-minutes: ${PAYMENT_EXPIRY_MINUTES:15}
    # Set in the Razorpay dashboard's Webhooks page when registering the webhook URL —
    # distinct from key-secret. Used to verify X-Razorpay-Signature on incoming webhook calls.
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

  msg91:
    # Blank authkey = not configured yet, NotificationService falls back to its
    # no-provider stub. See automation/n8n/MSG91_SETUP.md for signup/DLT steps.
    authkey: ${MSG91_AUTHKEY:}
    sender-id: ${MSG91_SENDER_ID:}
    route: "4"
    country: "91"
    api-url: https://control.msg91.com/api/v5/sms
    booking-confirmation-template-id: ${MSG91_TEMPLATE_BOOKING_CONFIRMATION:}
    pickup-reminder-template-id: ${MSG91_TEMPLATE_PICKUP_REMINDER:}
    ride-completion-template-id: ${MSG91_TEMPLATE_RIDE_COMPLETION:}
    otp-template-id: ${MSG91_TEMPLATE_OTP:}

  push:
    # Public key is safe to expose (served by GET /api/v1/push/vapid-public-key); keep a real
    # dev default for local convenience. Private key must never have a real default here —
    # same rule as razorpay.key-secret above.
    vapid-public-key: ${VAPID_PUBLIC_KEY:BKjTGkFD_SyqnXf_IhH2Wwf5WbEbYtEFehXyd5PQVkzAERuCDyBNjxv74_MvF0EENcjDMtB9A9L-0DGTn43vLqE}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:support@puduvandi.com}

# ===== Logging =====
logging:
  level:
    com.puduvandi: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ===== Swagger =====
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
